<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Embedded Data App</title>
		<script type="module" src="./element.js"></script>
		<style>
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				display: flex;
				flex-direction: column;
				font: 15px/1.6 system-ui, -apple-system, sans-serif;
				color: #111827;
				background: #fff;
			}
			header {
				flex: none;
				display: flex;
				align-items: baseline;
				gap: 12px;
				padding: 12px 20px;
				border-bottom: 1px solid #e5e7eb;
			}
			h1 {
				font-size: 15px;
				font-weight: 600;
				margin: 0;
			}
			#bridge {
				font-size: 13px;
				color: #6b7280;
			}
			/* Data Apps lay out against the full viewport; a narrow column breaks
			   the app's own layout, not this page. */
			textql-app {
				flex: 1;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<header>
			<h1 id="title">Loading…</h1>
			<span id="bridge"></span>
		</header>

		<textql-app></textql-app>

		<script type="module">
			const element = document.querySelector('textql-app');
			const title = document.getElementById('title');
			const bridge = document.getElementById('bridge');

			function showMeta({ name, functions }) {
				title.textContent = name;
				document.title = name;

				// `functions` is what the element declares in its `hello`, and the
				// only names POST /compute will run. Empty means the app never
				// calls back to your server — the compute route stays unused.
				bridge.textContent = functions.length
					? `${functions.length} compute functions: ${functions.join(', ')}`
					: 'no compute functions — document only';
			}

			// The fetch can land before this script parses.
			element.addEventListener('app-meta', (event) => showMeta(event.detail));
			if (element.meta) showMeta(element.meta);

			element.addEventListener('app-ready', () => {
				bridge.textContent += ' · bridge connected';
			});

			// Runtime errors are already consoled by the element; surfacing them
			// here is what makes a failing compute call visible in the demo.
			element.addEventListener('app-error', (event) => {
				bridge.textContent = `app error: ${event.detail.message}`;
			});
		</script>
	</body>
</html>
